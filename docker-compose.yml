services:
  app:
    image: simple-test-docker:${IMAGE_TAG:-latest}  # Use environment variable, default to latest
    # Remove the build section if you're building manually in the workflow
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"  # Map same port on host and container
    environment:
      - PORT=${PORT}  # Tell the app to use the PORT from environment
      - NODE_ENV=production