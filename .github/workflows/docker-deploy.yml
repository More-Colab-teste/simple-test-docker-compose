name: Docker Compose Deploy with Versioning

on:
  push:
    branches:
      - production  # This triggers the workflow only on 'production' branch pushes

jobs:
  deploy:
    runs-on: self-hosted  # Runs on your self-hosted runner

    steps:
      # Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Generate unique version tag
      - name: Generate version tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${SHORT_SHA}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV

      # Build the Docker image with version tag
      - name: Build and tag Docker image
        run: |
          docker build -t simple-test-docker:${{ env.VERSION }} .
          # Also tag as latest for convenience
          docker tag simple-test-docker:${{ env.VERSION }} simple-test-docker:latest

      # Deploy with Docker Compose
      - name: Deploy with version tag
        env:
          PORT: ${{ secrets.PORT }}
          IMAGE_TAG: ${{ env.VERSION }}
        run: |
          cd /home/ubuntu/BIOma/simple-test-docker-compose

          # Export the variables to make them available to docker-compose
          export PORT
          export IMAGE_TAG

          # Stop old deployment
          docker compose down || true
          
          # Deploy new version (without --build since we built manually)
          docker compose up -d
          
          # List all versions available
          echo "Available versions:"
          docker images simple-test-docker --format "{{.Tag}}" | sort -r