name: Docker Compose Deploy

on:
  push:
    branches:
      - production  # This triggers the workflow only on 'production' branch pushes

jobs:
  deploy:
    runs-on: self-hosted  # Runs on your self-hosted runner

    steps:
      # Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t simple-test-docker:latest .

      # Stop and remove old containers (if any)
      - name: Stop old container (if exists)
        run: |
          docker-compose down || true

      # Deploy with Docker Compose (instead of docker run)
      - name: Run new container with Docker Compose
        run: |
          # Export PORT secret for use in the compose file
          export PORT=${{ secrets.PORT }}

          # Assuming the self-hosted runner is in the correct directory where `docker-compose.yml` is located
          cd /home/ubuntu/BIOma/simple-test-docker-compose  # Adjust this path to your project folder

          # Ensure docker-compose.yml uses the PORT environment variable
          # If PORT is set as an environment variable in docker-compose.yml
          docker-compose up -d --build  # Rebuild and start the containers in detached mode
